<style>
  :root { color-scheme: light; --paper:#f5f6f8; --ink:#202639; --quiet:#546171; --line:#d6dce3; --wine:#883846; --blue:#244d78; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.55 "Barlow","Microsoft YaHei UI",system-ui,sans-serif; }
  main { max-width:1060px; padding:50px clamp(16px,5vw,60px) 44px; margin:auto; }
  header { display:flex; align-items:center; justify-content:space-between; gap:1.5rem; border-bottom:3px solid var(--ink); padding-bottom:20px; }
  h1 { font:650 clamp(27px,4vw,45px)/1.2 "Barlow","Microsoft YaHei UI",sans-serif; letter-spacing:-.03em; margin:0 0 9px; }
  p { margin:0; }
  header p, .note, .sub { color:var(--quiet); font-size:14px; }
  button, input, select { font:inherit; color:var(--ink); }
  button, select, input { min-height:40px; border:1px solid #a4afbb; border-radius:8px; background:white; padding:6px 12px; }
  button, select { cursor:pointer; }
  button:hover:enabled { background:#eef3f8; border-color:var(--blue); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { color:white; border-color:var(--blue); background:var(--blue); }
  button.primary:hover:enabled { background:#183b60; }
  :focus-visible { outline:3px solid #7987d7; outline-offset:3px; }
  .filters { display:grid; grid-template-columns:minmax(140px,1fr) auto auto; gap:12px; margin:24px 0 12px; }
  .filters label { color:var(--quiet); font-size:13px; }
  .filters :is(input,select) { display:block; width:100%; font-size:15px; margin-top:4px; }
  .stats { display:flex; align-items:center; justify-content:space-between; gap:1em; padding:4px 0 15px; font-size:14px; color:var(--quiet); }
  #progress-label { color:var(--ink); font-weight:600; }
  #warnings { color:#7c371b; background:#fff3d9; padding:8px 12px; margin-bottom:10px; }
  #items { border-top:1px solid var(--line); }
  .item { display:grid; grid-template-columns:104px 1fr auto; gap:22px; align-items:center; border-bottom:1px solid var(--line); padding:14px 2px; }
  .picture { display:grid; place-items:center; width:104px; height:87px; border:1px solid #804851; border-radius:7px; background-color:#521f2a; background-image:linear-gradient(#88445144 1px,transparent 1px),linear-gradient(90deg,#88445144 1px,transparent 1px); background-size:22px 22px; }
  .picture a { display:grid; place-items:center; width:100%; height:100%; }
  .picture img { display:block; object-fit:contain; width:100%; height:84px; padding:3px; }
  .picture button { font-size:13px; min-height:34px; padding:5px 8px; }
  .item h2 { margin:1px 0 4px; font-size:19px; line-height:1.4; overflow-wrap:anywhere; }
  .meta { color:var(--quiet); font-size:13px; }
  .original { margin-top:4px; }
  .recognition-note { margin-top:6px; font-size:14px; }
  .actions { display:flex; gap:8px; align-items:center; }
  .actions button { font-size:14px; min-height:36px; }
  .state { color:#406954; font-weight:600; font-size:14px; }
  form { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  form label { width:100%; font-size:14px; font-weight:600; }
  form input { flex:1 1 8em; min-width:0; width:12em; }
  footer { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:1rem; padding:18px 0; }
  .pager { display:flex; align-items:center; gap:12px; }
  a { color:var(--blue); }
  #message { min-height:1.35em; }
  #provenance { margin-top:10px; }
  .empty { color:var(--quiet); padding:28px 0; }
  [hidden] { display:none!important; }
  @media(max-width:660px) {
    main { padding-top:28px; }
    header { align-items:flex-start; flex-wrap:wrap; gap:12px; }
    .filters { grid-template-columns:1fr 1fr; }
    .filters label:first-child { grid-column:1/-1; }
    .item { grid-template-columns:85px minmax(0,1fr); gap:4px 14px; }
    .picture { width:85px; height:74px; grid-row:span 2; }
    .picture img { height:70px; }
    .actions { grid-column:2; flex-wrap:wrap; }
    .stats { align-items:flex-start; flex-direction:column; gap:3px; }
  }
</style>
</head>

<main>
  <header>

</main>

41","name":"火箭燃料","category":"工具材料","image":"https://playerhub.df.qq.com/playerhub/60004/object/15020010033.png","source":"https://orzice.com/v/info/p141"},{"id":"1027","name":"强化碳纤维板","category":"工具材料","image":"https://playerhub.df.qq.com/playerhub/60004/object/15020010031.png","source":"https://orzice.com/v/info/1027"},{"id":"1043","name":"黄金瞪羚","category":"工艺藏品","image":"https://playerhub.df.qq.com/playerhub/60004/object/15010050001.png","source":"https://orzice.com/v/info/1043"}],"qualitySource":"https://www.taptap.cn/moment/866401325682788431"}</script>
<script>
  const catalog = JSON.parse(document.querySelector('#catalog').textContent);
  const rows = catalog.items;
  const byId = new Map(rows.map(item => [item.id,item]));
  const $ = selector => document.querySelector(selector);
  const list = $('#items');
  const storageKey = 'delta-collectible-review-v1';
  const pageSize = 16;
  let page = 0;
  let edits = {};
  function warnStorage() {
    $('#warnings').hidden = false;
    $('#warnings').textContent = '浏览器未能保存审核进度。关闭页面前请导出图鉴。';
  }
  try { edits = JSON.parse(localStorage.getItem(storageKey) || '{}') || {}; }
  catch { warnStorage(); }
  function current(item) {
    const edit = edits[item.id];
    return edit && edit.image === item.image && edit.base === item.name
      ? { ...item, name:edit.name, sourceName:item.sourceName || item.name, reviewed:true } : item;
  }
  function status(item) {
    if (!item.reviewed) return 'pending';
    return item.sourceName && item.sourceName !== item.name ? 'corrected' : 'confirmed';
  }
  function lookalikes(item) {
    return (item.lookalikeIds || []).map(id => byId.get(id)).filter(Boolean).map(current);
  }
  function el(tag, text, cls) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  }
  function button(label, action) {
    const b = el('button',label);
    b.type = 'button'; b.dataset.action = action;
    return b;
  }
  function remember(original, name) {
    edits[original.id] = { base:original.name, image:original.image, name };
    try { localStorage.setItem(storageKey, JSON.stringify(edits)); }
    catch { warnStorage(); }
    render();
    $('#message').textContent = '已核对「' + name + '」。';
  }
  function picture(item) {
    const box = el('div',undefined,'picture');
    function load() {
      const link = el('a');
      link.href = item.image; link.target = '_blank'; link.rel = 'noopener noreferrer';
      link.setAttribute('aria-label','查看「' + item.name + '」原图');
      const img = el('img'); img.alt = item.name; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
      img.addEventListener('error',() => {
        const retry = button('重试图片','retry');
        retry.onclick = load; box.replaceChildren(retry);
      },{once:true});
      link.append(img); box.replaceChildren(link); img.src = item.image;
    }
    load(); return box;
  }
  function row(original) {
    const item = current(original);
    const container = el('article',undefined,'item'); container.dataset.id = item.id;
    const details = el('div');
    const title = el('h2',item.name);
    const info = el('div',[item.category,item.id].filter(Boolean).join(' · '),'meta');
    if (item.source) {
      const source = el('a','资料页'); source.href = item.source;
      source.target = '_blank'; source.rel = 'noopener noreferrer';
      info.append(' · ',source);
    }
    details.append(title,info);
    if (item.recognitionNote) details.append(el('p',item.recognitionNote,'recognition-note'));
    const similar = lookalikes(item);
    if (similar.length) details.append(el('p','易混物品　' + similar.map(other => other.name).join('、'),'meta'));
    if (status(item) === 'corrected') details.append(el('div','原名　' + item.sourceName,'meta original'));
    const actions = el('div',undefined,'actions');
    if (item.reviewed) {
      actions.append(el('span',status(item) === 'corrected' ? '已改名' : '已确认','state'));
    } else {
      const ok = button('确认','confirm');
      ok.onclick = () => remember(original,item.name);
      actions.append(ok);
    }
    const edit = button('改名','edit');
    edit.onclick = () => {
      const form = el('form');
      const input = el('input'); input.name = 'name'; input.required = true; input.value = item.name;
      input.id = 'name-' + item.id;
      const label = el('label','物品名称'); label.htmlFor = input.id;
      const save = button('保存名称','save'); save.type = 'submit';
      const cancel = button('取消','cancel'); cancel.onclick = () => render();
      form.onsubmit = event => {
        event.preventDefault();
        const name = input.value.trim();
        if (name) remember(original,name); else input.focus();
      };
      form.append(label,input,save,cancel);
      details.replaceChildren(form); actions.hidden = true; input.focus(); input.select();
    };
    actions.append(edit); container.append(picture(item),details,actions);
    return container;
  }
  function render() {
    const query = $('#search').value.trim().toLowerCase();
    const category = $('#category-filter').value, filter = $('#status-filter').value;
    const selected = rows.filter(original => {
      const item = current(original);
      return (!category || category === item.category) && (!filter || filter === status(item))
        && [item.name,item.sourceName,item.category,item.id,item.recognitionNote,...lookalikes(item).map(other => other.name)]
          .some(text => String(text ?? '').toLowerCase().includes(query));
    });
    const pages = Math.max(1,Math.ceil(selected.length/pageSize));
    page = Math.min(page,pages-1);
    const start = page * pageSize, shown = selected.slice(start,start+pageSize);
    $('#progress-label').textContent = '已审核 ' + rows.filter(i=>current(i).reviewed).length + ' / ' + rows.length;
    $('#range').textContent = shown.length ? '显示第 ' + (start+1) + ' 至 ' + (start+shown.length) + ' 项，共 ' + selected.length + ' 项' : '0 项';
    $('#page-label').textContent = (page+1) + ' / ' + pages;
    $('#previous').disabled = page === 0; $('#next').disabled = page === pages-1;
    list.replaceChildren(...shown.map(row));
    if (!shown.length) list.append(el('p','没有符合条件的物品。试试其他名称或调整筛选。','empty'));
  }
  for (const category of [...new Set(rows.map(i=>i.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'))) {
    $('#category-filter').add(new Option(category,category));
  }
  $('#provenance').textContent = [catalog.scope,catalog.asOf].filter(Boolean).join(' · ');
  if (catalog.source) {
    const source = el('a','在线图鉴'); source.href = catalog.source;
    source.target = '_blank'; source.rel = 'noopener noreferrer';
    $('#provenance').append(' · ',source);
  }
  if (catalog.qualitySource) {
    const quality = el('a','赛季品质说明'); quality.href = catalog.qualitySource;
    quality.target = '_blank'; quality.rel = 'noopener noreferrer';
    $('#provenance').append(' · ',quality);
  }
  for (const control of [$('#search'),$('#category-filter'),$('#status-filter')]) {
    control.addEventListener(control.tagName === 'INPUT' ? 'input' : 'change',() => { page = 0; render(); });
  }
  function changePage(delta) {
    page += delta; render(); $('#progress-label').scrollIntoView({block:'start'});
  }
  $('#previous').onclick = () => changePage(-1);
  $('#next').onclick = () => changePage(1);
  $('#export').onclick = () => {
    const data = { ...catalog, items:rows.map(current) };
    const blob = new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = el('a'); link.download = 'red-items.json'; link.href = url; link.click();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    $('#message').textContent = '已导出全部 ' + rows.length + ' 项。用下载的 red-items.json 替换扩展源码的 knowledge/red-items.json，然后重新构建。';
  };
  render();
</script>
